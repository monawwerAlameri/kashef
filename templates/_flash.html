{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, m in msgs %}
<div class="alert alert-{{ cat if cat in ['success','danger','warning','info'] else 'info' }} alert-dismissible fade show kf-alert" role="alert">{{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
{% endfor %}
{% endwith %}
