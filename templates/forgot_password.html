{% extends 'base.html' %}
{% block title %}{{ t('forgot_title') }}{% endblock %}

{% block public %}
<div class="auth-card">
  <a class="brand light" href="{{ url_for('index') }}">
    <span class="brand-logo"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt=""></span>
    <div class="brand-text"><b>{{ t('app_name') }}</b><small>{{ 'Kashef' if lang == 'ar' else 'كاشف' }}</small></div>
  </a>
  <h2>{{ t('forgot_title') }}</h2>
  <p class="sub">{{ t('forgot_desc') }}</p>

  <form method="post" class="vstack gap-3">
    <div>
      <label class="form-label small" for="fpEmail">{{ t('email') }}</label>
      <div class="field">
        <span class="field-ic"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" id="fpEmail" class="form-control kf-input" placeholder="name@example.com" dir="ltr" required autofocus>
      </div>
    </div>

    <button type="submit" class="btn-auth">
      <span>{{ t('reset_btn') }}</span> <i class="bi bi-envelope-arrow-up"></i>
    </button>
  </form>

  <p class="auth-alt">
    <a href="{{ url_for('login') }}">{{ t('back_to_login') }}</a>
  </p>
</div>
{% endblock %}
