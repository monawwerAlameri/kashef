{% extends 'base.html' %}
{% block title %}{{ t('register') }}{% endblock %}

{% block public %}
<div class="auth-card">
  <a class="brand light" href="{{ url_for('index') }}">
    <span class="brand-logo"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt=""></span>
    <div class="brand-text"><b>{{ t('app_name') }}</b><small>{{ 'Kashef' if lang == 'ar' else 'كاشف' }}</small></div>
  </a>
  <h2>{{ t('register') }}</h2>
  <p class="sub">{{ t('reg_sub') }}</p>

  <form method="post" class="vstack gap-3">
    <div>
      <label class="form-label small" for="regName">{{ t('name') }}</label>
      <div class="field">
        <span class="field-ic"><i class="bi bi-person"></i></span>
        <input type="text" name="name" id="regName" class="form-control kf-input" placeholder="{{ t('reg_name_ph') }}" autocomplete="name" required autofocus>
      </div>
    </div>

    <div>
      <label class="form-label small" for="regEmail">{{ t('email') }}</label>
      <div class="field">
        <span class="field-ic"><i class="bi bi-envelope"></i></span>
        <input type="email" name="email" id="regEmail" class="form-control kf-input" placeholder="name@example.com" autocomplete="email" dir="ltr" required>
      </div>
    </div>

    <div>
      <label class="form-label small" for="regPw">{{ t('password') }}</label>
      <div class="field">
        <span class="field-ic"><i class="bi bi-lock"></i></span>
        <input type="password" name="password" id="regPw" class="form-control kf-input" minlength="6" autocomplete="new-password" dir="ltr" required>
      </div>
      <small class="text-muted d-block mt-1">{{ t('reg_pw_hint') }}</small>
    </div>

    <div>
      <label class="form-label small" for="regConfirm">{{ t('confirm_password') }}</label>
      <div class="field">
        <span class="field-ic"><i class="bi bi-lock-fill"></i></span>
        <input type="password" name="confirm" id="regConfirm" class="form-control kf-input" minlength="6" autocomplete="new-password" dir="ltr" required>
      </div>
    </div>

    <div class="form-check">
      <input class="form-check-input" type="checkbox" name="agree_terms" id="agreeTerms" required>
      <label class="form-check-label small" for="agreeTerms">
        {{ t('agree_terms') }} (<a href="{{ url_for('terms') }}" target="_blank">{{ t('nav_terms') }}</a>)
      </label>
    </div>

    <button type="submit" class="btn-auth">
      <span>{{ t('register') }}</span> <i class="bi bi-person-check"></i>
    </button>
  </form>

  <p class="auth-alt">
    {{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('login') }}</a>
  </p>
</div>
{% endblock %}
